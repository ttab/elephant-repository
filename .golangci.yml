version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errorlint
    - exhaustive
    - forbidigo
    - gochecknoinits
    - goconst
    - gocritic
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - importas
    - lll
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilnil
    - nlreturn
    - nolintlint
    - predeclared
    - promlinter
    - revive
    - staticcheck
    - testpackage
    - thelper
    - unconvert
    - unparam
    - usetesting
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    godox:
      keywords:
        - FIXME
        - BUG
    nestif:
      min-complexity: 6
    wrapcheck:
      extra-ignore-sigs:
        # The elephantine/rpc helpers construct RPC errors. Wrapping one would
        # bury the code the handler picked, which is the whole point of it.
        - github.com/ttab/elephantine/rpc.
        - (context.Context).Err(
        - github.com/ttab/elephantine/pg.WithTX(
        - github.com/ttab/elephantine/pg/joblock.Lock).RunWithContext(
    gomoddirectives:
      # The Connect migration pins elephantine and elephant-api to sibling
      # checkouts until both are tagged. Drop the local replacements, and these
      # two settings with them, once they are.
      replace-local: true
      replace-allow-list:
        - github.com/ttab/elephantine
        - github.com/ttab/elephant-api
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # The Twirp hooks are deprecated in favour of the elephantine/rpc
      # interceptors, but they are exactly what the Twirp mount still needs
      # while the service is dual-stack. Twirp's retirement removes both the
      # hooks and this exclusion.
      - linters: [staticcheck]
        text: 'SA1019: github.com/ttab/elephantine\.(LoggingHooks|NewTwirpMetricsHooks)'
      # A test that checks what the server answered passes the RPC error
      # through verbatim; wrapping it would only get in the way.
      - linters: [wrapcheck]
        path: _test\.go$
      - linters: [gosec, goconst]
        path: _test\.go$
      - linters: [gosec]
        path: jwt_dummy\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
